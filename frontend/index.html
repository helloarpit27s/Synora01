<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="ZenHealth — symptom triage, condition-aware nutrition and wearable anomaly detection in one calm place." />
    <title>ZenHealth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply stored display preferences before first paint to avoid a flash.
      try {
        var p = JSON.parse(localStorage.getItem('zenhealth.prefs.v1') || '{}');
        var r = document.documentElement;
        if (p.theme === 'dark' || p.theme === 'light') r.setAttribute('data-theme', p.theme);
        r.setAttribute('data-contrast', p.contrast === 'high' ? 'high' : 'normal');
        r.setAttribute('data-motion', p.motion === 'reduced' ? 'reduced' : 'full');
        r.setAttribute('data-text', p.textScale || 'comfortable');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
